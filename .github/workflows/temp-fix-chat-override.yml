name: Temporary Backup Restore Fix

on:
  push:
    branches: [ui-mechat-rework]
    paths:
      - '.github/workflows/temp-fix-chat-override.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-mechat-rework

      - name: Close full-backup restore modal synchronously
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/ImportExportModal.tsx')
          s = p.read_text()
          start_marker = '          if (state.characters && state.chats) {'
          end_marker = '          } else if (state.legacyMessages) {'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('full-backup restore branch not found')
          replacement = '''          if (state.characters && state.chats) {
            // A full restore replaces the app state. Close this modal before handing
            // the restored state to the parent so stale modal UI cannot survive the
            // character/chat replacement or block the restored navigation.
            onClose();
            setStatusMessage(null);
            onRestoreFullBackup({
              characters: state.characters,
              chats: state.chats,
              settings: state.settings,
            });
            return;
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Commit backup restore fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ImportExportModal.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Close full backup restore modal immediately'
          git push origin HEAD:ui-mechat-rework