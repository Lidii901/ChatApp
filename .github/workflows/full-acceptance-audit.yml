name: Temporary Full Acceptance Audit

# Final deploy-synchronised rerun after the backup-restore UI fix.
on:
  push:
    branches: [ui-mechat-rework]
    paths:
      - 'tests/uiMockAcceptance.mjs'
      - 'tests/patch_acceptance.py'
      - '.github/workflows/full-acceptance-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-mechat-rework

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harden temporary audit selectors
        shell: bash
        run: |
          python3 tests/patch_acceptance.py
          sed -i 's/Foto jetzt senden lassen/Szenenmoment senden lassen/g' tests/uiMockAcceptance.mjs
          sed -i 's/Situational photo request job/Situational scene-moment job/g' tests/uiMockAcceptance.mjs
          sed -i 's/photo job lifecycle\/unlock/scene-moment job lifecycle\/unlock/g' tests/uiMockAcceptance.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/uiMockAcceptance.mjs')
          s = p.read_text()
          old = "  await page.getByRole('button', { name: 'Standardinhalte wiederherstellen' }).click();\n  await page.getByRole('button', { name: 'Abbrechen' }).click();"
          new = "  await page.getByRole('button', { name: 'Standardinhalte wiederherstellen' }).click();\n  await page.getByRole('main').getByRole('button', { name: 'Abbrechen', exact: true }).click();"
          if old not in s:
              raise SystemExit('reset cancel selector block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright for temporary audit
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic UI audit
        id: audit
        env:
          PREVIEW_URL: https://chatapp-preview.onrender.com
        shell: bash
        run: |
          set +e
          node tests/uiMockAcceptance.mjs 2>&1 | tee acceptance-audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-audit-report
          path: acceptance-audit.log
          if-no-files-found: error

      - name: Fail if audit found errors
        if: always()
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"