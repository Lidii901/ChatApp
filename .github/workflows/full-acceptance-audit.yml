name: Temporary Full Acceptance Audit

on:
  push:
    branches: [ui-mechat-rework]
    paths:
      - 'tests/uiMockAcceptance.mjs'
      - '.github/workflows/full-acceptance-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-mechat-rework

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harden temporary audit selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/uiMockAcceptance.mjs')
          s = p.read_text()

          old = '''  const userMessage = page.locator('[id^="message-"]').filter({ hasText: 'AUDIT EN:' }).first();
  await userMessage.locator('button[title="Kopieren"]').click();
  assert.match(await page.evaluate(() => navigator.clipboard.readText()), /AUDIT EN:/);
  await userMessage.locator('button[title="Bearbeiten"]').click();
  await userMessage.locator('textarea').fill('AUDIT EN EDITED: I lower the book.');
  await userMessage.getByRole('button', { name: 'Speichern' }).click();
  assert.match((await userMessage.textContent()) || '', /AUDIT EN EDITED/);
  await userMessage.locator('button[title="Löschen"]').click();'''
          new = '''  const userMessageCandidate = page.locator('[id^="message-"]').filter({ hasText: 'AUDIT EN:' }).first();
  const userMessageId = await userMessageCandidate.getAttribute('id');
  assert.ok(userMessageId, 'user message has no stable id');
  const userMessage = page.locator(`#${userMessageId}`);
  await userMessage.locator('button[title="Kopieren"]').click();
  assert.match(await page.evaluate(() => navigator.clipboard.readText()), /AUDIT EN:/);
  await userMessage.locator('button[title="Bearbeiten"]').click();
  await userMessage.locator('textarea').fill('AUDIT EN EDITED: I lower the book.');
  await userMessage.getByRole('button', { name: 'Speichern', exact: true }).click();
  assert.match((await userMessage.textContent()) || '', /AUDIT EN EDITED/);
  await userMessage.locator('button[title="Löschen"]').click();'''
          if old not in s:
            raise SystemExit('message-control selector block not found')
          s = s.replace(old, new)

          old = "  await page.getByRole('button', { name: 'KI aktualisieren' }).click();"
          new = "  const summarizeButton = page.locator('button').filter({ hasText: /aktualis/i }).last();\n  await summarizeButton.waitFor({ state: 'visible' });\n  if (await summarizeButton.isDisabled()) await page.waitForFunction(() => Array.from(document.querySelectorAll('button')).some(b => /aktualis/i.test(b.textContent || '') && !b.disabled), {}, { timeout: 30000 });\n  await page.locator('button').filter({ hasText: /aktualis/i }).last().click();"
          if old not in s:
            raise SystemExit('summarize selector not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright for temporary audit
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic UI audit
        id: audit
        env:
          PREVIEW_URL: https://chatapp-preview.onrender.com
        shell: bash
        run: |
          set +e
          node tests/uiMockAcceptance.mjs 2>&1 | tee acceptance-audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-audit-report
          path: acceptance-audit.log
          if-no-files-found: error

      - name: Fail if audit found errors
        if: always()
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
