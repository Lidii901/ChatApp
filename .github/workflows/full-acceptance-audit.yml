name: Temporary Full Acceptance Audit

on:
  push:
    branches: [ui-mechat-rework]
    paths:
      - 'tests/fullAcceptanceAudit.mjs'
      - '.github/workflows/full-acceptance-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-mechat-rework

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright for temporary audit
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full acceptance audit
        id: audit
        env:
          PREVIEW_URL: https://chatapp-preview.onrender.com
        shell: bash
        run: |
          set +e
          node tests/fullAcceptanceAudit.mjs 2>&1 | tee acceptance-audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-audit-report
          path: acceptance-audit.log
          if-no-files-found: error

      - name: Fail if audit found errors
        if: always()
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
