name: Temporary apply live greeting hotfix

on:
  push:
    branches: [fix-live-new-chat-greeting]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-new-chat-greeting

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply hotfix
        run: python3 scripts/apply_live_greeting_hotfix.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Existing prompt tests
        run: npm run test:prompt

      - name: Greeting fallback regression
        run: npx tsx tests/apiErrors.test.ts

      - name: Remove temporary files
        run: |
          rm .github/workflows/temp-apply-live-greeting-hotfix.yml
          rm scripts/apply_live_greeting_hotfix.py

      - name: Commit hotfix
        run: |
          git config user.name "Lidii901"
          git config user.email "lidija755@gmail.com"
          git add -A
          git commit -m "Handle OpenRouter limits when starting chats"
          git push origin HEAD:fix-live-new-chat-greeting
