name: Validate ChatApp

on:
  pull_request:
    branches: [main]
  push:
    branches: [ui-mechat-rework]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Chub Dean master alignment
        run: python3 scripts/apply_chub_dean_master_alignment.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Existing prompt/converter tests
        run: npm run test:prompt

      - name: Language and Chat Memory regression tests
        run: npx tsx tests/chubLanguageRegression.test.ts

      - name: Chub prompt/context/lore parity tests
        run: npx tsx tests/chubParityRegression.test.ts

      - name: Legacy Character Card migration tests
        run: npx tsx tests/legacyCharacterMigration.test.ts

      - name: Imitate Me knowledge-boundary regression tests
        run: npx tsx tests/imitateKnowledge.test.ts

      - name: Commit Chub Dean master alignment
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/defaultCharacters.ts src/utils/promptBuilder.ts src/utils/contextManager.ts server.ts tests/promptBuilder.test.ts tests/imitateKnowledge.test.ts
            git commit -m "Align Dean and impersonation with Chub reference"
            git push origin HEAD:ui-mechat-rework
          fi
