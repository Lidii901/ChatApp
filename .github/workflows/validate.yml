name: Validate ChatApp

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Existing prompt/converter tests
        run: npm run test:prompt

      - name: Language and Chat Memory regression tests
        run: npx tsx tests/chubLanguageRegression.test.ts

      - name: Chub prompt/context/lore parity tests
        run: npx tsx tests/chubParityRegression.test.ts

      - name: Legacy Character Card migration tests
        run: npx tsx tests/legacyCharacterMigration.test.ts

      - name: Imitate Me knowledge-boundary regression tests
        run: npx tsx tests/imitateKnowledge.test.ts

      - name: API error and greeting fallback regression tests
        run: npx tsx tests/apiErrors.test.ts
